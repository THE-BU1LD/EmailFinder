name: Verified draft pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: emailfinder-draft-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Compile
        run: python -m compileall -q emailfinder tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Exercise example draft build
        shell: bash
        run: |
          set -euo pipefail
          python -m emailfinder.cli build-drafts --input examples/contacts.csv --suppression-ledger examples/suppression.csv --output /tmp/review-batch.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/review-batch.json').read_text())
          assert payload['mode'] == 'DRAFT_ONLY'
          assert payload['draft_count'] == 2
          assert payload['draft_count'] <= 20
          assert payload['suppression_email_count'] == 1
          assert any(x['reason'] == 'suppression_ledger' for x in payload['excluded'])
          assert all(x['approval_state'] == 'PENDING_HUMAN_APPROVAL' for x in payload['drafts'])
          PY
